<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Velora Beauty Studio | Enquiry</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #fffaf8;
            color: #3d302d;
        }

        header {
            background-color: #f3e4df;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: Georgia, serif;
            font-size: 28px;
            color: #8b5e58;
            font-weight: bold;
        }

        nav a {
            text-decoration: none;
            color: #3d302d;
            margin-left: 25px;
        }

        .page-title {
            text-align: center;
            padding: 70px 20px;
            background-color: #f8ece8;
        }

        .page-title h1 {
            font-family: Georgia, serif;
            font-size: 45px;
            color: #8b5e58;
        }

        .form-container {
            max-width: 700px;
            margin: 60px auto;
            padding: 40px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .form-container p {
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d8c5c0;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            height: 130px;
            resize: vertical;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background-color: #8b5e58;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #6f4944;
        }

        footer {
            background-color: #3d302d;
            color: white;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 5px;
            }

            .form-container {
                margin: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Header and Navigation -->
    <header>
        <div class="logo">Velora Beauty Studio</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- Page Heading -->
    <section class="page-title">
        <h1>Make an Enquiry</h1>
    </section>

    <!-- Enquiry Form -->
    <main class="form-container">

        <p>
            Interested in one of our beauty services?
            Complete the form below and our team will get
            back to you.
        </p>

        <form>

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter your phone number" required>

            <label for="service">Service of Interest</label>

            <select id="service" name="service" required>
                <option value="">Select a service</option>
                <option value="lashes">Lash Extensions</option>
                <option value="brows">Brow Services</option>
                <option value="makeup">Makeup</option>
                <option value="skincare">Skincare</option>
                <option value="nails">Nails</option>
                <option value="package">Beauty Package</option>
            </select>

            <label for="date">Preferred Date</label>
            <input type="date" id="date" name="date">

            <label for="message">Message</label>
            <textarea id="message" name="message"
                      placeholder="Tell us how we can help..."></textarea>

            <button type="submit">Send Enquiry</button>

        </form>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Velora Beauty Studio. All Rights Reserved.</p>
    </footer>

</body>
</html>
